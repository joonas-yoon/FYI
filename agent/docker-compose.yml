# FYI-Agent 서비스 — GPU(CUDA) 사용, RESTful API 노출.
#
# 실행:
#   docker compose up -d --build
#
# 문서 인덱싱 (POST /chat 사용 전 필수):
#   docker compose exec fyi-agent python scripts/ingest.py
#     → 호스트의 WIKI_HOST_PATH(기본 ./data/wiki) 아래 *.md 파일을 재귀 탐색,
#       UTF-8 로 읽어 LangChain Document 로 변환한 뒤
#       800자 단위(120자 오버랩)로 청킹하고
#       BAAI/bge-m3 모델로 임베딩해 Chroma 벡터 스토어(/data/vectorstore)에 저장.
#       같은 파일을 다시 실행하면 "source::순번" ID 기반 중복 방지로 추가분만 색인.
#
#   docker compose exec fyi-agent python scripts/ingest.py --reset
#     → 기존 컬렉션을 전부 삭제한 뒤 처음부터 재색인.

services:
  fyi-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # .env 의 프록시 값을 빌드(pip 설치)로 전달. Docker 사전정의 ARG 라
        # RUN 에 자동 적용되고 이미지/히스토리에 영구 저장되지 않음.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: fyi-agent:latest
    container_name: fyi-agent
    restart: unless-stopped
    env_file: .env
    environment:
      # .env 의 대문자 프록시 변수를 소문자로도 노출 (도구별 호환).
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 호스트의 위키 문서를 읽기 전용으로 마운트 (.env 의 WIKI_HOST_PATH).
      - "${WIKI_HOST_PATH:-./data/wiki}:/data/wiki:ro"
      # 벡터 인덱스와 임베딩 모델 캐시는 named volume 으로 영속화.
      - fyi-vectorstore:/data/vectorstore
      - hf-cache:/data/hf-cache
    # NVIDIA GPU 를 컨테이너에 할당 (NVIDIA Container Toolkit 필요).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  fyi-vectorstore:
  hf-cache:
