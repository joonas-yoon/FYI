# FYI — 통합 단일 이미지(검색 + 요약 + 컨텍스트 대화 + 인덱싱)를 하나의 컨테이너로 실행.
#
# FYI 게이트웨이와 agent RAG 엔진은 하나의 FastAPI 앱(app.main:app)으로 통합되어
# 단일 이미지로 빌드됩니다. 모든 런타임 코드는 ./agent/app 에 있으므로 빌드 컨텍스트는
# ./agent 입니다.
#
# 실행:
#   docker compose up -d --build
#
# 문서 인덱싱 (검색/대화 전 1회 필수, 임베딩 프로바이더 변경 시 --reset):
#   docker compose exec fyi python scripts/ingest.py --reset
#
# 엔드포인트 (http://localhost:8000):
#   POST /search   검색 + (선택)요약(summarize) + (선택)컨텍스트 대화(session_id)
#                  → AnswerDict 형태: {query, result, source_documents, summary?}
#   POST /chat     멀티턴 대화      POST /ingest  인덱싱      GET /health  헬스체크
#   문서:  /docs (Swagger)
#
# 설정은 ./agent/.env 를 사용합니다. LLM_PROVIDER / EMBEDDING_PROVIDER 로
# Claude(anthropic/huggingface) ↔ 로컬 Ollama 를 전환할 수 있습니다.

services:
  fyi:
    build:
      context: ./agent
      dockerfile: docker/Dockerfile
      args:
        # ./agent/.env 의 프록시 값을 빌드(pip 설치)로 전달. Docker 사전정의 ARG 라
        # RUN 에 자동 적용되고 이미지/히스토리에 영구 저장되지 않음.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    image: fyi:latest
    container_name: fyi
    restart: unless-stopped
    env_file: ./agent/.env
    environment:
      # 대문자 프록시 변수를 소문자로도 노출 (도구별 호환).
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 호스트의 위키 문서를 읽기 전용으로 마운트 (./agent/.env 의 WIKI_HOST_PATH).
      - "${WIKI_HOST_PATH:-./examples/wiki}:/data/wiki:ro"
      # 벡터 인덱스와 임베딩 모델 캐시는 named volume 으로 영속화.
      - fyi-vectorstore:/data/vectorstore
      - hf-cache:/data/hf-cache
    # --- GPU (선택) ---------------------------------------------------------
    # NVIDIA GPU + Container Toolkit 이 있으면 아래 블록의 주석을 해제해 임베딩을
    # GPU 로 가속하세요. EMBEDDING_DEVICE=auto 이면 GPU 가 없을 때 자동으로 CPU 로
    # 폴백하므로, 기본값(주석 처리)으로도 CPU 에서 그대로 동작합니다.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  fyi-vectorstore:
  hf-cache:
